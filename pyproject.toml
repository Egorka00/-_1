[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uvm-assembler-v6"
version = "1.0.0"
description = "Ассемблер для учебной виртуальной машины (Вариант 6)"
authors = [
    {name = "Student", email = "student@example.com"}
]
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}

[project.scripts]
uvm-assembler-v6 = "src.assembler:main"

[tool.setuptools.packages.find]
where = ["src"]
