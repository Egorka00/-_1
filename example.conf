# Пример 1: Конфигурация веб-сервера
var basePort 8080;
var maxThreads 4;

server {
    name = [[My Web Server]],
    port = §basePort 100 +§,
    threads = §maxThreads 2 *§,
    endpoints = #( [[/api]] [[/static]] [[/admin]] ),
    settings = {
        debug = true,
        timeout = 30.5,
        ssl = {
            enabled = true,
            cert = [[server.crt]],
            key = [[server.key]]
        }
    }
}

# Пример 2: Настройки приложения
app {
    title = [[Конфигурационный менеджер]],
    version = 2.1,
    authors = #( [[Иван]] [[Петр]] [[Алексей]] ),
    metadata = {
        created = [[2024-01-15]],
        license = [[MIT]]
    }
}
